stages:
  data_ingestion:
    cmd: python src/cnnClassifier/pipeline/stage_01_data_ingestion.py
    deps:
    - src/cnnClassifier/pipeline/stage_01_data_ingestion.py
    - config/config.yaml
    outs:
    - artifacts/data_ingestion/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone

  data_split:
    cmd: python run_split.py
    deps:
    - run_split.py
    - artifacts/data_ingestion/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone
    outs:
    - artifacts/data_ingestion/CT-KIDNEY-DATASET-split

  prepare_base_model:
    cmd: python src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
    deps:
    - src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
    - config/config.yaml
    params:
    - IMAGE_SIZE
    - INCLUDE_TOP
    - CLASSES
    - WEIGHTS
    - LEARNING_RATE
    - MODEL_NAME
    outs:
    - artifacts/prepare_base_model

  model_training:
    cmd: python src/cnnClassifier/pipeline/stage_03_model_training.py
    deps:
    - src/cnnClassifier/pipeline/stage_03_model_training.py
    - config/config.yaml
    - artifacts/data_ingestion/CT-KIDNEY-DATASET-split
    - artifacts/prepare_base_model
    params:
    - IMAGE_SIZE
    - AUGMENTATION
    - EPOCHS
    - BATCH_SIZE
    - MODEL_NAME
    outs:
    - artifacts/training

  model_evaluation:
    cmd: python src/cnnClassifier/pipeline/stage_04_model_evaluation.py
    deps:
    - src/cnnClassifier/pipeline/stage_04_model_evaluation.py
    - config/config.yaml
    - artifacts/data_ingestion/CT-KIDNEY-DATASET-split
    - artifacts/training
    params:
    - IMAGE_SIZE
    - BATCH_SIZE
    - MODEL_NAME
    metrics:
    - scores.json:
        cache: false